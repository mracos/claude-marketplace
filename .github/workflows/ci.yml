name: ci
on: [push, pull_request]
jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate .

  stash:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/stash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate .
      - run: claude plugin test

  prs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/prs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.287
      - run: claude plugin validate .
      - run: claude plugin test

